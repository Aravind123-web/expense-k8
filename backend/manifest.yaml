apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: expense
data:
  DB_HOST: mysql # mysql component service name

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: expense
  # These labels are deployemnt related labesl
  labels:
    component: backend
    project: expense
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      component: backend
      project: expense
      tier: app
  # pod defination
  template:
    metadata:
      # These labels are pod related lables
      labels:
         component: backend
         project: expense
         tier: app
    spec:
      containers:
        - name: backend
          image: aravind19981999/expense-backend:v1.0
          envFrom:
          - configMapRef:
            name: backend
          
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expense
spec:
  selector:
    component: backend
    project: expense
    tier: app
  ports:
    - protocol: TCP
      port: 8080 # service port
      targetPort: 8080 # target port on the pod