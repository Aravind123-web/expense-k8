# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: frontend
#   namespace: expense
# data:
#   DB_HOST: mysql # mysql component service name

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: expense
  # These labels are deployemnt related labesl
  labels:
    component: frontend
    project: expense
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      component: frontend
      project: expense
      tier: web
  # pod defination
  template:
    metadata:
      # These labels are pod related lables
      labels:
         component: frontend
         project: expense
         tier: web
    spec:
      containers:
        - name: frontend
          image: aravind19981999/expense-frontend:v1.0
          # envFrom:
          # - configMapRef:
          #      name: frontend
          
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: expense
spec:
  type: LoadBalancer
  selector:
    component: frontend
    project: expense
    tier: web
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # target port on the pod